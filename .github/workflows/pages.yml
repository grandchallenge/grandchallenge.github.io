name: Validate and publish isolated preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python validate.py
      - run: python scripts/build_publication.py
  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python validate.py
      - run: python scripts/build_publication.py
      - name: Record isolated public feed artifact identity
        run: sha256sum dist/assets/operations/index.html dist/assets/operations/console.css dist/assets/operations/console.js dist/assets/operations/feed.json dist/assets/operations/live.html dist/assets/operations/live.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: upload
        uses: grandchallenge/upload-pages-artifact@4934497e00858680775a65f544192e61e1b1b3cb
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for exact uploaded artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ID" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 12); do
            if data=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME"); then
              if jq -e --arg name "$ARTIFACT_NAME" --argjson id "$EXPECTED_ID" '
                .total_count == 1 and
                (.artifacts | length) == 1 and
                .artifacts[0].id == $id and
                .artifacts[0].name == $name and
                .artifacts[0].expired == false
              ' <<< "$data" >/dev/null; then
                echo "Exact Pages artifact visible: $EXPECTED_ID"
                sleep 5
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Exact upload not visible after bounded wait"
          exit 1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
